<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobalt Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#060a12;font-family:Inter,system-ui,sans-serif;color:#e6edf7;user-select:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .panel{position:absolute;background:rgba(10,16,28,.78);border:1px solid #1d2a40;border-radius:14px;padding:10px 14px;font-size:13px;backdrop-filter:blur(4px)}
  #lb{top:12px;right:12px;min-width:170px}
  #lb h3{margin:0 0 6px;font-size:11px;letter-spacing:.6px;color:#8aa0c0}
  #lb ol{margin:0;padding-left:18px}
  #lb li{margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
  #lb li.me{color:#9cc3ff;font-weight:700}
  #info{left:12px;bottom:12px;color:#a9b8d0}
  #info b{color:#e6edf7}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,16,.72)}
  .card{background:#0d1524;border:1px solid #22324d;border-radius:20px;padding:28px;width:min(360px,88vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .card h1{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-.5px}
  .card h1 span{color:#5b9bff}
  .card p{color:#8aa0c0;font-size:13.5px;margin:6px 0 16px;line-height:1.5}
  input{width:100%;box-sizing:border-box;background:#111c30;border:1px solid #22324d;border-radius:12px;padding:12px 14px;color:#e6edf7;font:inherit;font-size:16px;outline:none;text-align:center}
  input:focus{border-color:#5b9bff}
  button{margin-top:12px;width:100%;background:#bcd3ff;color:#06122a;border:0;border-radius:22px;padding:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #status{font-size:12.5px;color:#8aa0c0;margin-top:12px;min-height:18px}
  #dead{color:#ff9aa8;font-weight:700;margin-bottom:8px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="lb"><h3>LEADERBOARD</h3><ol id="lbList"></ol></div>
<div class="panel" id="info"></div>
<div id="start">
  <div class="card">
    <div id="dead"></div>
    <h1>cobalt <span>arena</span></h1>
    <p>Eat dots to grow. Eat players smaller than you. Avoid bigger ones. Move with your mouse or finger.</p>
    <input id="name" maxlength="14" placeholder="Your name" autocomplete="off">
    <button id="play">Play</button>
    <div id="status"></div>
  </div>
</div>

<script src="../../supabase-config.js"></script>
<script type="module">
// ---------- settings ----------
const WORLD = 3000;          // world is WORLD x WORLD
const FOOD = 320;            // food dots (same on every player's screen)
const ROOM_MAX = 6;          // players per room (keeps Supabase free-plan message limits safe)
const SEND_MS = 300;         // how often we send our position (~3 per second)
const START_MASS = 20;
const COLORS = ['#5b9bff', '#ff6b8b', '#ffd166', '#6ee7a8', '#c084fc', '#fb923c', '#22d3ee', '#f472b6', '#a3e635'];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

const R = m => Math.sqrt(m) * 4;
const speed = m => Math.max(70, 520 * Math.pow(m, -0.25));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => String(s || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 14);

// ---------- shared food: position comes from (slot, generation), so everyone agrees ----------
const foodGen = new Uint32Array(FOOD);
function hash(a, b){ let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const food = i => ({x: 30 + hash(i, foodGen[i] * 2) * (WORLD - 60), y: 30 + hash(i + 9999, foodGen[i] * 2 + 1) * (WORLD - 60), c: COLORS[(i + foodGen[i]) % COLORS.length]});

// ---------- me ----------
const myId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 12);
let me = null, alive = false, pointer = {x: 0, y: 0, active: false}, pendingEats = [];
const others = new Map(); // id -> {x,y,vx,vy,m,n,c,t,rx,ry,rm}

function spawn(name){
  me = {x: 200 + Math.random() * (WORLD - 400), y: 200 + Math.random() * (WORLD - 400), vx: 0, vy: 0, m: START_MASS,
        n: name, c: COLORS[Math.random() * COLORS.length | 0]};
  alive = true;
}

// ---------- networking (Supabase Realtime) ----------
const CFG = window.COBALT_SUPABASE;
let sb = null, ch = null, room = 0, synced = false, net = 'offline';
const statusEl = document.getElementById('status');

async function connect(){
  if (!CFG || !CFG.url || !CFG.anonKey){ net = 'offline'; statusEl.textContent = 'Multiplayer needs Supabase set up on this site. Playing solo for now.'; return; }
  statusEl.textContent = 'Finding a room…';
  try {
    const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb = createClient(CFG.url, CFG.anonKey, {realtime: {params: {eventsPerSecond: 10}}});
  } catch(e){ net = 'offline'; statusEl.textContent = "Couldn't reach the multiplayer server. Playing solo."; return; }
  for (let r = 1; r <= 30; r++){
    const c = sb.channel('cobalt-arena-' + r, {config: {broadcast: {self: false}, presence: {key: myId}}});
    const joined = await new Promise(res => {
      let done = false; const finish = v => { if (!done){ done = true; res(v); } };
      c.on('presence', {event: 'sync'}, () => {});
      c.subscribe(st => {
        if (st === 'SUBSCRIBED') setTimeout(() => finish(Object.keys(c.presenceState()).length < ROOM_MAX), 700);
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') finish(null);
      });
      setTimeout(() => finish(null), 8000);
    });
    if (joined === true){ ch = c; room = r; break; }
    sb.removeChannel(c);
    if (joined === null){ net = 'offline'; statusEl.textContent = "Couldn't reach the multiplayer server. Playing solo."; return; }
  }
  if (!ch){ net = 'offline'; statusEl.textContent = 'Every room is full right now. Playing solo.'; return; }
  net = 'online'; statusEl.textContent = '';
  ch.on('broadcast', {event: 's'}, ({payload: p}) => onState(p));
  ch.on('broadcast', {event: 'ate'}, ({payload: p}) => { if (p && p.by === myId && alive) me.m += Math.min(5000, Number(p.m) || 0) * 0.8; });
  ch.on('broadcast', {event: 'sync?'}, ({payload: p}) => answerSync(p));
  ch.on('broadcast', {event: 'sync'}, ({payload: p}) => applySync(p));
  ch.on('presence', {event: 'leave'}, ({key}) => others.delete(key));
  await ch.track({joined: Date.now()});
  ch.send({type: 'broadcast', event: 'sync?', payload: {id: myId}});
}
function onState(p){
  if (!p || typeof p.id !== 'string' || p.id === myId) return;
  const o = others.get(p.id) || {rx: p.x, ry: p.y, rm: p.m};
  Object.assign(o, {x: +p.x || 0, y: +p.y || 0, vx: +p.vx || 0, vy: +p.vy || 0, m: Math.max(1, Math.min(20000, +p.m || 1)),
    n: clean(p.n) || 'Player', c: COLORS.includes(p.c) ? p.c : '#5b9bff', t: performance.now(), dead: !!p.d});
  others.set(p.id, o);
  if (Array.isArray(p.e)) for (const [i, g] of p.e) if (i >= 0 && i < FOOD && g > foodGen[i]) foodGen[i] = g;
}
let syncTimer = null;
function answerSync(p){
  if (!p || p.id === myId || syncTimer) return;
  syncTimer = setTimeout(() => { syncTimer = null; ch && ch.send({type: 'broadcast', event: 'sync', payload: {to: p.id, g: Array.from(foodGen)}}); }, 100 + Math.random() * 600);
}
function applySync(p){
  if (!p) return;
  if (p.to !== myId){ if (syncTimer){ clearTimeout(syncTimer); syncTimer = null; } return; } // someone else already answered
  if (synced || !Array.isArray(p.g)) return;
  synced = true; p.g.forEach((g, i) => { if (i < FOOD && g > foodGen[i]) foodGen[i] = g; });
}
setInterval(() => {
  if (net !== 'online' || !ch || !me) return;
  ch.send({type: 'broadcast', event: 's', payload: {id: myId, x: Math.round(me.x), y: Math.round(me.y), vx: Math.round(me.vx), vy: Math.round(me.vy),
    m: Math.round(me.m * 10) / 10, n: me.n, c: me.c, d: alive ? 0 : 1, e: pendingEats.splice(0, 40)}});
}, SEND_MS);
addEventListener('pagehide', () => { try { ch && ch.untrack(); sb && sb.removeChannel(ch); } catch(e){} });

// ---------- input ----------
function setPointer(e){ pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; }
cv.addEventListener('pointermove', setPointer);
cv.addEventListener('pointerdown', setPointer);
cv.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse') pointer.active = false; });

// ---------- game loop ----------
let last = performance.now(), cam = {x: WORLD / 2, y: WORLD / 2, z: 1};
function step(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (alive){
    // move toward the pointer
    let dx = 0, dy = 0;
    if (pointer.active){ dx = pointer.x - W / 2; dy = pointer.y - H / 2; }
    const d = Math.hypot(dx, dy), sp = speed(me.m) * Math.min(1, d / 120);
    me.vx = d > 4 ? dx / d * sp : 0; me.vy = d > 4 ? dy / d * sp : 0;
    const r = R(me.m);
    me.x = Math.max(r * 0.5, Math.min(WORLD - r * 0.5, me.x + me.vx * dt));
    me.y = Math.max(r * 0.5, Math.min(WORLD - r * 0.5, me.y + me.vy * dt));
    if (me.m > 60) me.m -= (me.m - 60) * 0.008 * dt; // big blobs slowly shrink
    // eat food
    for (let i = 0; i < FOOD; i++){
      const f = food(i);
      if ((f.x - me.x) ** 2 + (f.y - me.y) ** 2 < r * r){ me.m += 1; foodGen[i]++; pendingEats.push([i, foodGen[i]]); }
    }
    // got eaten by someone bigger? (each player decides for themselves)
    for (const [id, o] of others){
      if (o.dead || now - o.t > 3000) continue;
      const ox = o.rx, oy = o.ry, dist = Math.hypot(ox - me.x, oy - me.y);
      if (o.m > me.m * 1.2 && dist < R(o.m) - r * 0.35){
        alive = false;
        net === 'online' && ch.send({type: 'broadcast', event: 'ate', payload: {by: id, m: me.m}});
        showStart(`Eaten by ${o.n}! You reached mass ${Math.round(me.m)}.`);
        break;
      }
    }
  }
  // smooth other players toward where they should be now
  for (const [id, o] of others){
    if (now - o.t > 3500){ others.delete(id); continue; }
    const ahead = Math.min(0.4, (now - o.t) / 1000);
    const tx = o.x + o.vx * ahead, ty = o.y + o.vy * ahead;
    o.rx += (tx - o.rx) * Math.min(1, dt * 10); o.ry += (ty - o.ry) * Math.min(1, dt * 10); o.rm += (o.m - o.rm) * Math.min(1, dt * 6);
  }
  draw(now);
  requestAnimationFrame(step);
}

function draw(now){
  const focus = me || {x: WORLD / 2, y: WORLD / 2, m: START_MASS};
  const targetZ = Math.max(0.35, 1.15 - (R(focus.m) - 18) / 260) * Math.min(W, H) / 760;
  cam.z += (targetZ - cam.z) * 0.08; cam.x += (focus.x - cam.x) * 0.2; cam.y += (focus.y - cam.y) * 0.2;
  ctx.fillStyle = '#060a12'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  // grid + border
  ctx.strokeStyle = '#0f1a2c'; ctx.lineWidth = 2;
  const x0 = Math.max(0, Math.floor((cam.x - W / 2 / cam.z) / 60) * 60), x1 = Math.min(WORLD, cam.x + W / 2 / cam.z);
  const y0 = Math.max(0, Math.floor((cam.y - H / 2 / cam.z) / 60) * 60), y1 = Math.min(WORLD, cam.y + H / 2 / cam.z);
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 60){ ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = y0; y <= y1; y += 60){ ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.strokeStyle = '#2b4a7a'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, WORLD, WORLD);
  // food
  for (let i = 0; i < FOOD; i++){
    const f = food(i);
    if (Math.abs(f.x - cam.x) > W / cam.z || Math.abs(f.y - cam.y) > H / cam.z) continue;
    ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 7); ctx.fill();
  }
  // players, smallest on top
  const all = [];
  for (const [, o] of others) if (!o.dead) all.push({x: o.rx, y: o.ry, m: o.rm, n: o.n, c: o.c});
  if (alive) all.push({x: me.x, y: me.y, m: me.m, n: me.n, c: me.c, me: true});
  all.sort((a, b) => b.m - a.m);
  for (const p of all){
    const r = R(p.m);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
    ctx.lineWidth = Math.max(3, r * 0.08); ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.stroke();
    if (p.me){ ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.stroke(); }
    const fs = Math.max(12, r * 0.38);
    ctx.font = `800 ${fs}px Inter, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(p.n, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.n, p.x, p.y);
  }
  ctx.restore();
  // HUD
  if (Math.floor(now / 250) !== draw.hud){ draw.hud = Math.floor(now / 250); hud(all); }
}
function hud(all){
  const top = all.slice(0, 5);
  document.getElementById('lbList').innerHTML = top.map(p => `<li class="${p.me ? 'me' : ''}">${esc(p.n)} · ${Math.round(p.m)}</li>`).join('') || '<li>Nobody yet</li>';
  const count = others.size + (alive ? 1 : 0);
  document.getElementById('info').innerHTML = net === 'online'
    ? `Room <b>${room}</b> · <b>${count}</b> player${count === 1 ? '' : 's'}${count < 2 ? ' · waiting for others to join' : ''}${alive ? ` · mass <b>${Math.round(me.m)}</b>` : ''}`
    : `Solo mode${alive ? ` · mass <b>${Math.round(me.m)}</b>` : ''}`;
}

// ---------- start / respawn ----------
const startEl = document.getElementById('start'), nameEl = document.getElementById('name'), playBtn = document.getElementById('play');
try { nameEl.value = localStorage.getItem('arena_name') || ''; } catch(e){}
function showStart(msg){
  document.getElementById('dead').textContent = msg || '';
  document.getElementById('dead').style.display = msg ? 'block' : 'none';
  playBtn.textContent = msg ? 'Play again' : 'Play';
  startEl.style.display = 'flex';
}
let connecting = null;
playBtn.onclick = async () => {
  const name = clean(nameEl.value) || 'Player';
  try { localStorage.setItem('arena_name', name); } catch(e){}
  playBtn.disabled = true;
  if (!connecting) connecting = connect();
  await connecting;
  playBtn.disabled = false;
  spawn(name);
  startEl.style.display = 'none';
};
nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') playBtn.click(); });
requestAnimationFrame(step);
</script>
</body>
</html>
