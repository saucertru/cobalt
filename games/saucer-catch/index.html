<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saucer Catch</title>
<style>
  html,body{margin:0;height:100%;background:#0b0814;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, px, stars, score, lives, t, over, keys = {};
function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; c.width = W*d; c.height = H*d; x.setTransform(d,0,0,d,0,0); }
function reset(){ px = W/2; stars = []; score = 0; lives = 3; t = 0; over = false; }
addEventListener('resize', size); size(); reset();
addEventListener('keydown', e => { keys[e.key] = true; if (over && (e.key === ' ' || e.key === 'Enter')) reset(); });
addEventListener('keyup', e => { keys[e.key] = false; });
c.addEventListener('pointermove', e => { px = e.clientX; });
c.addEventListener('pointerdown', e => { px = e.clientX; if (over) reset(); });
function step(){
  if (!over){
    if (keys.ArrowLeft) px -= 9; if (keys.ArrowRight) px += 9;
    px = Math.max(40, Math.min(W-40, px)); t++;
    if (t % Math.max(18, 50 - score) === 0) stars.push({x: 20 + Math.random()*(W-40), y: -20, v: 2.5 + Math.random()*2 + score/25});
    for (const s of stars){
      s.y += s.v;
      if (!s.hit && s.y > H-70 && s.y < H-40 && Math.abs(s.x - px) < 46){ s.hit = true; score++; }
      if (!s.hit && !s.gone && s.y > H){ s.gone = true; if (--lives <= 0) over = true; }
    }
    stars = stars.filter(s => !s.hit && !s.gone);
  }
  x.fillStyle = '#0b0814'; x.fillRect(0,0,W,H);
  for (const s of stars){ x.fillStyle = '#fff35c'; x.beginPath(); for (let i=0;i<10;i++){ const r = i%2 ? 5 : 12, a = i*Math.PI/5 - Math.PI/2; x.lineTo(s.x + r*Math.cos(a), s.y + r*Math.sin(a)); } x.fill(); }
  x.fillStyle = '#c4b5fd'; x.beginPath(); x.ellipse(px, H-52, 42, 13, 0, 0, 7); x.fill();
  x.fillStyle = '#7dd3fc'; x.beginPath(); x.ellipse(px, H-62, 18, 14, 0, Math.PI, 0); x.fill();
  x.fillStyle = '#ece8f7'; x.font = '700 20px system-ui'; x.textAlign = 'left'; x.fillText('Score ' + score, 20, 36);
  x.textAlign = 'right'; x.fillStyle = '#ff7eb6'; x.fillText('♥'.repeat(Math.max(0, lives)), W-20, 36);
  if (over){ x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0,0,W,H); x.fillStyle = '#ece8f7'; x.textAlign = 'center'; x.font = '800 34px system-ui'; x.fillText('Game over: ' + score, W/2, H/2); x.font = '500 17px system-ui'; x.fillText('Tap or press Space to play again', W/2, H/2 + 34); }
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
