<!DOCTYPE html>
<html>
<head>
  <title>My Proxy</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #111; color: white; }
    #bar { padding: 10px; background: #222; display: flex; gap: 10px; }
    input { flex: 1; padding: 8px; border-radius: 4px; border: none; }
    button { padding: 8px 16px; cursor: pointer; }
    iframe { flex: 1; border: none; width: 100%; background: white; }
  </style>
</head>
<body>
  <div id="bar">
    <input id="url-input" type="text" placeholder="Search or enter a website (e.g. wikipedia.org)" />
    <button id="go-btn">Go</button>
  </div>
  <iframe id="proxy-frame"></iframe>

  <script src="/scram/scramjet.all.js"></script>
  <script type="module">
    import { BareMuxConnection } from "/baremux/index.mjs";

    // Start Scramjet
    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });
    await scramjet.init();
    await navigator.serviceWorker.register("/sw.js");

    // Connect to your Render Wisp engine
    const connection = new BareMuxConnection("/baremux/worker.js");
    await connection.setTransport("/libcurl/index.mjs", [
      { wisp: "wss://://my-wisp-server-5rcr.onrender.com/" }
    ]);

    // Handle the Go button and Enter key
    function go() {
      let input = document.getElementById("url-input").value.trim();
      if (!input) return;
      let url = input.includes(".") && !input.includes(" ")
        ? (input.startsWith("http") ? input : "https://" + input)
        : "https://duckduckgo.com" + encodeURIComponent(input);
      document.getElementById("proxy-frame").src = scramjet.encodeUrl(url);
    }

    document.getElementById("go-btn").addEventListener("click", go);
    document.getElementById("url-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") go();
    });
  </script>
</body>
</html>
