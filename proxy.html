<!DOCTYPE html>
<html>
<head>
  <title>My Proxy</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #bar { padding: 10px; background: #222; display: flex; gap: 10px; }
    input { flex: 1; padding: 8px; border-radius: 4px; border: none; }
    button { padding: 8px 16px; cursor: pointer; }
    iframe { flex: 1; border: none; width: 100%; }
  </style>
</head>
<body>
  <div id="bar">
    <input id="url-input" type="text" placeholder="Enter a website (e.g. https://wikipedia.org)" />
    <button onclick="go()">Go</button>
  </div>
  <iframe id="proxy-frame"></iframe>

  <script src="/scram/scramjet.all.js"></script>
  <script type="module">
    import { BareMuxConnection } from "/baremux/index.mjs";

    // Start Scramjet
    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });
    await scramjet.init();
    await navigator.serviceWorker.register("/sw.js");

    // Connect to your Render engine
    const connection = new BareMuxConnection("/baremux/bare.worker.js");
    await connection.setTransport("/libcurl/index.mjs", [
      { wisp: "wss://://onrender.com" }
    ]);

    // Handle the Go button
    window.go = () => {
      let url = document.getElementById("url-input").value;
      if (!url.startsWith("http")) url = "https://" + url;
      document.getElementById("proxy-frame").src = scramjet.encodeUrl(url);
    };
  </script>
</body>
</html>
